<!DOCTYPE html> <!-- Declara el uso de HTML5 -->
<html lang="en"> <!-- Define el idioma principal (inglés) -->
<head> <!-- Contiene metadatos y configuración del sitio -->
    <meta charset="UTF-8"> <!-- Permite caracteres especiales y acentos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la página a pantallas móviles -->
    <title>Imagenes en HTML</title> <!-- Título en la pestaña del navegador -->
</head> <!-- Fin de metadatos -->
<body> <!-- Contenido visible de la página -->
    <h2>Imagenes en HTML</h2> <!-- Subtítulo principal -->
    <h3>Locales</h3> <!-- Subtítulo para imágenes guardadas en la misma carpeta -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- Muestra imagen local con texto alternativo -->
    <h3>Locales redismensionado</h3> <!-- Subtítulo para imágenes con tamaño modificado -->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- Imagen de subcarpeta con ancho (200px) y alto (100px) -->
    <h3>Desde internet</h3> <!-- Subtítulo para imágenes en línea -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" width="200" height="200" > <!--Carga imagen externa via URL-->
    <h3>Animaciones</h3> <!-- Subtítulo para imágenes animadas (GIF) -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" width="200" height="200"><!-- Carga un GIF animado mediante URL -->
</body> <!-- Fin del contenido visible -->
</html> <!-- Fin del documento -->
