<!DOCTYPE html> <!-- Indica al navegador que el documento utiliza el estándar HTML5 -->
<html lang="en"> <!-- Abre el documento HTML y establece el idioma principal como inglés -->

<head> <!-- Abre la sección de metadatos (configuraciones e información no visible directamente) -->
    <meta charset="UTF-8"> <!-- Define la codificación UTF-8 para permitir acentos, caracteres especiales y la letra ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura la vista para que la página sea adaptable a móviles y pantallas de distintos tamaños -->
    <title>Salto de linea en HTML</title> <!-- Define el título que aparece en la pestaña del navegador -->
</head> <!-- Cierra la sección de metadatos -->

<body> <!-- Abre el cuerpo del documento, donde va todo el contenido visible para el usuario -->
    <h1>Lenguaje de programacion</h1> <!-- Encabezado principal de la página (Título de nivel 1) -->
    <p>En la actualidad se utilizan diferentes <!-- Inicia la etiqueta de párrafo e introduce el texto inicial -->
        lenguajes de programacion tanto para desarrollo <!-- Continúa con el texto del párrafo -->
        web, desarrollo movil, entranamiento de inteligencia <!-- Continúa con el texto del párrafo -->
        artificial, pero de los mas usados son <!-- Continúa con el texto del párrafo -->
        los siguientes:<br> <!-- Muestra el texto e inserta un salto de línea (<br>) sin abrir un nuevo párrafo -->
        Dart<br> <!-- Muestra "Dart" y genera un salto de línea hacia la siguiente fila -->
        Flutter<br> <!-- Muestra "Flutter" y genera un salto de línea -->
        Python<br> <!-- Muestra "Python" y genera un salto de línea -->
        Ruby<br> <!-- Muestra "Ruby" y genera un salto de línea -->
        Java<br> <!-- Muestra "Java" y genera un salto de línea -->
        TypeScript<br> <!-- Muestra "TypeScript" y genera un salto de línea -->
        Entre otros. <!-- Texto final dentro de la lista explicativa -->
    </p> <!-- Cierra la etiqueta de párrafo -->
</body> <!-- Cierra la sección del cuerpo de la página -->

</html> <!-- Cierra la etiqueta del documento HTML completo -->
